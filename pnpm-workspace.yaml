packages:
  - "apps/*"
  - "packages/*"

# Resolve only releases that have had at least one day of public exposure.
# Explicit configuration makes the age gate strict instead of pnpm 11's
# backward-compatible fallback behavior.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
trustLockfile: false

allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# Temporary exception for a disputed advisory affecting development tooling.
# Remove when the advisory is corrected or the dependency tree no longer uses braces.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
