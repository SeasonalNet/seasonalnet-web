packages:
  - "apps/*"
  - "packages/*"

# Resolve only releases that have had at least one day of public exposure.
# Explicit configuration makes the age gate strict instead of pnpm 12's
# backward-compatible fallback behavior.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
trustLockfile: false

allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
  
# /// exceptions for dependencies with disputed GHSA's; presently braces and deepmerge /// 
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-gcqx-w48m-w2h4  

overrides:
  vite@>=8.2.0 <=8.2.3: ^8.2.4
  zod@<4.6.6: ^4.6.6
