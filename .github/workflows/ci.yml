name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version
          node --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const pkg = require("./package.json");

          if (pkg.packageManager !== "pnpm@11.22.0") {
            throw new Error(
              `expected packageManager pnpm@11.22.0, got ${pkg.packageManager}`
            );
          }

          console.log("package manager:", pkg.packageManager);
          NODE

          test -f pnpm-workspace.yaml
          test -f pnpm-lock.yaml
          test ! -e package-lock.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency policy
        run: |
          pnpm ignored-builds
          pnpm --recursive list --depth -1

      - name: Verify dependency supply chain
        run: make supply-chain

      - name: Run governed quality gate
        run: make quality

      - name: Build all applications
        run: make build

  security:
    uses: ./.github/workflows/security.yml

  publish-container:
    needs: [web, security]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Log in to GHCR
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push all frontend images
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          publish() {
            local image="$1" app="$2"
            local tags=(--tag "$image:sha-${GITHUB_SHA:0:12}")
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              tags+=(--tag "$image:latest")
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              tags+=(--tag "$image:$GITHUB_REF_NAME" --tag "$image:latest")
            fi
            docker buildx build --push --build-arg "APP=$app" "${tags[@]}" .
          }
          for app in www radio pbx prov admin agent docs; do
            publish "ghcr.io/$owner/seasonalnet-web-$app" "$app"
          done
