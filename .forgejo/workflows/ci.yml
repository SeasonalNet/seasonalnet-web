name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: node24

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version
          node --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const pkg = require("./package.json");

          if (pkg.packageManager !== "pnpm@11.17.0") {
            throw new Error(
              `expected packageManager pnpm@11.17.0, got ${pkg.packageManager}`
            );
          }

          console.log("package manager:", pkg.packageManager);
          NODE

          test -f pnpm-workspace.yaml
          test -f pnpm-lock.yaml
          test ! -e package-lock.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency policy
        run: |
          pnpm ignored-builds
          KNIP_DISABLE_RAW_TRANSFER=1 pnpm deps:audit
          pnpm --recursive list --depth -1

      - name: Lint currently clean workspaces
        run: |
          pnpm --filter @seasonalnet/admin lint
          pnpm --filter @seasonalnet/docs lint
          pnpm --filter @seasonalnet/pbx lint
          pnpm --filter @seasonalnet/prov lint
          pnpm --filter @seasonalnet/www lint

      - name: Report known Agent lint debt
        continue-on-error: true
        run: pnpm --filter @seasonalnet/agent lint

      - name: Report known Radio lint debt
        continue-on-error: true
        run: pnpm --filter @seasonalnet/radio lint

      - name: Build all applications
        run: pnpm build

      - name: Report transitive peer advisories
        continue-on-error: true
        run: pnpm peers check
