name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  web:
    runs-on: node24

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version
          node --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const pkg = require("./package.json");

          if (pkg.packageManager !== "pnpm@11.22.0") {
            throw new Error(
              `expected packageManager pnpm@11.22.0, got ${pkg.packageManager}`
            );
          }

          console.log("package manager:", pkg.packageManager);
          NODE

          test -f pnpm-workspace.yaml
          test -f pnpm-lock.yaml
          test ! -e package-lock.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency policy
        run: |
          pnpm ignored-builds
          pnpm --recursive list --depth -1

      - name: Verify dependency supply chain
        run: make supply-chain

      - name: Run governed quality gate
        run: make quality

      - name: Build all applications
        run: make build

  publish-container:
    name: Publish frontend images
    needs: [web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [docker, slate-builder]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Docker CLI and Buildx
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          test "$ID" = debian
          printf '%s\n' \
            "Types: deb" \
            "URIs: https://download.docker.com/linux/debian" \
            "Suites: $VERSION_CODENAME" \
            "Components: stable" \
            "Architectures: $(dpkg --print-architecture)" \
            "Signed-By: /etc/apt/keyrings/docker.asc" \
            > /etc/apt/sources.list.d/docker.sources
          apt-get update
          apt-get install --yes --no-install-recommends docker-ce-cli docker-buildx-plugin
          docker version
          docker buildx version
      - name: Trust the SeasonalNet Harbor CA
        run: update-ca-certificates
      - name: Log in to Harbor
        env:
          HARBOR_CI_USERNAME: ${{ secrets.HARBOR_CI_USERNAME }}
          HARBOR_CI_PASSWORD: ${{ secrets.HARBOR_CI_PASSWORD }}
        run: printf '%s' "$HARBOR_CI_PASSWORD" | docker login registry.lan.seasonalnet.org --username "$HARBOR_CI_USERNAME" --password-stdin
      - name: Build and push all frontend images
        shell: bash
        run: |
          set -euo pipefail
          for app in www radio pbx prov admin agent docs; do
            image="registry.lan.seasonalnet.org/seasonalnet/seasonalnet-web-$app"
            tags=(--tag "$image:sha-${GITHUB_SHA:0:12}")
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              tags+=(--tag "$image:latest")
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              tags+=(--tag "$image:$GITHUB_REF_NAME" --tag "$image:latest")
            fi
            docker buildx build --push --build-arg "APP=$app" "${tags[@]}" .
          done
