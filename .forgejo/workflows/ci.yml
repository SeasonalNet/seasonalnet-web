name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: node20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package manifest found."
          fi
      - name: Verify package metadata
        run: |
          node -e "const pkg=require('./package.json'); if (!pkg.workspaces?.length) throw new Error('expected npm workspaces'); console.log('workspaces:', pkg.workspaces.join(', '))"
      - name: Lint currently clean workspaces
        run: |
          npm run lint --workspace @seasonalnet/admin
          npm run lint --workspace @seasonalnet/docs
          npm run lint --workspace @seasonalnet/pbx
          npm run lint --workspace @seasonalnet/prov
          npm run lint --workspace @seasonalnet/www
      - name: Report known lint debt without gating CI
        continue-on-error: true
        run: |
          npm run lint --workspace @seasonalnet/agent
          npm run lint --workspace @seasonalnet/radio
